# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Continuous Integration"

run-name: "CI • ${{ github.ref_name }} @${{ github.actor }}"

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"
    workflow_dispatch:

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

defaults:
    run:
        shell: "bash"

jobs:
    test:
        name: "Test"
        runs-on: "ubuntu-latest"
        timeout-minutes: 15
        permissions:
            contents: "read"
            id-token: "write"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout Repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"

            - name: "Setup Python"
              uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
              with:
                  python-version: "3.14"
                  cache: "pip"

            - name: "Install Node Dependencies"
              run: "npm ci"

            - name: "Install Python Dependencies"
              run: "python -m pip install -r requirements-dev.txt"

            - name: "Run Release Verification"
              run: "npm run release:verify"

            - name: "Upload Python test results to Codecov"
              if: "${{ !cancelled() && hashFiles('coverage/pytest/junit.xml') != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "coverage/pytest/junit.xml"
                  flags: "python"
                  name: "pytest-junit-python"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload Python coverage to Codecov"
              if: "${{ !cancelled() && hashFiles('coverage/python/coverage.xml') != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "coverage/python/coverage.xml"
                  flags: "python"
                  name: "pytest-coverage-python"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true
